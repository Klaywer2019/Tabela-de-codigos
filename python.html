<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Docs - Dicionário Dev</title>
    <style>
        /* RESET E BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f0f; color: #e0e0e0; line-height: 1.6; }

        /* NAVBAR RESPONSIVA (Python Colors) */
        .navbar { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; /* Ajuste para mobile */
            gap: 10px; 
            padding: 15px; 
            background-color: #1a1a1a; 
            border-bottom: 2px solid #3776AB; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        
        .nav-link { 
            color: #fff; 
            text-decoration: none; 
            padding: 8px 12px; 
            font-size: 14px;
            font-weight: bold; 
            border: 1px solid #FFD43B; 
            border-radius: 5px; 
            transition: 0.3s; 
            white-space: nowrap;
        }
        
        .nav-link:hover { background-color: #FFD43B; color: #000; }
        .active { background-color: #3776AB; color: #fff; border-color: #3776AB; }

        header { text-align: center; margin: 40px 0; }
        h1 { color: #FFD43B; font-size: 2.2rem; }
        main { padding: 20px; max-width: 900px; margin: 0 auto; }
        
        /* SANFONA AZUL */
        details { margin-bottom: 20px; border: 1px solid #3776AB; border-radius: 8px; background-color: #1a1a1a; }
        summary { padding: 15px; cursor: pointer; color: #FFD43B; font-weight: bold; list-style: none; }
        summary::after { content: " ▼"; float: right; color: #3776AB; }
        details[open] summary::after { content: " ▲"; }

        /* TABELA */
        .container-tabela { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background-color: #1a1a1a; }
        th { background-color: #252525; color: #3776AB; padding: 15px; text-align: left; border: 1px solid #333; }
        td { padding: 15px; border: 1px solid #333; font-size: 0.95rem; }
        code { background-color: #2d2d2d; color: #FFD43B; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="../html.html" class="nav-link">HTML</a>
        <a href="../css.html" class="nav-link">CSS</a>
        <a href="../js/js.html" class="nav-link">JS</a>
        <a href="python.html" class="nav-link active">Python</a>
    </nav>

    <header>
        <h1>Python Documentation 🐍</h1>
        <p>A linguagem poderosa e simples.</p>
    </header>

    <main>
        <details>
            <summary>Comandos Básicos Python</summary>
            <div class="container-tabela">
                <table>
                    <thead>
                        <tr><th>Comando</th><th>Função</th></tr>
                    </thead>
                    <tbody>
                        <tr><td><code>print()</code></td><td>Exibe algo na tela</td></tr>
                        <tr><td><code>input()</code></td><td>Recebe dados do usuário</td></tr>
                        <tr><td><code>def</code></td><td>Define uma função</td></tr>
                        <tr><td><code>if / elif / else</code></td><td>Estruturas condicionais</td></tr>
                    </tbody>
                </table>
            </div>
        </details>
    </main>
</body>
</html>
